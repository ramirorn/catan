# Render Blueprint: one web service runs the Socket.io server and also serves
# the built React client, so the whole game lives at a single URL.
services:
  - type: web
    name: catan-shinobi
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Player accounts (optional). Without them everyone plays as a guest.
      # Set the values in the Render dashboard (Environment), never in git.
      - key: DATABASE_URL
        sync: false
      - key: NEON_AUTH_BASE_URL
        sync: false
